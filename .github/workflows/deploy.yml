# Production deploys, routed around Vercel's commit-author check.
#
# Why this exists: the GitHub account that authors commits here is linked to a
# different Vercel account than the one that owns the project, so Vercel's own
# Git integration blocks every push with "commit author does not have
# contributing access". Deploy hooks hit the same wall — they attribute to the
# branch-head author too. Deployments created through the API with the owner's
# token do not, so that is what this job does: one POST, then poll to a
# terminal state. Vercel builds from the Git source itself; nothing is
# uploaded from CI.
#
# Auto-deploy for main is disabled in vercel.json (git.deploymentEnabled), so
# this workflow is the only production deploy path. If it is failing, nothing
# is deploying. Requires the VERCEL_TOKEN repository secret; if the token is
# ever revoked, mint a new one at vercel.com/account/settings/tokens and run:
#   gh secret set VERCEL_TOKEN
#
# This whole arrangement becomes unnecessary the day the GitHub account is
# relinked to the owning Vercel account — then delete this file and the
# deploymentEnabled block in vercel.json, and let the Git integration do it.

name: Deploy to Vercel

on:
  push:
    branches: [main]
    # The mobile app is a separate workspace that Vercel never builds, so a
    # mobile-only commit should not spend a production deploy. packages/** is
    # deliberately absent: the web app compiles that code, so it must deploy.
    # A push touching both still deploys, and workflow_dispatch forces one.
    paths-ignore:
      - "mobile/**"
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_TEAM_ID: team_agPxLGxNlPlPpLAOX5Arnx1u
  VERCEL_PROJECT_ID: prj_sJxjQdS2FK93j4MeYcH6TPWdOmbV
  GITHUB_REPO_ID: "1265216629"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Registry health, reported before the deploy but deliberately not
      # gating it. Two things have to be true before this can block, and
      # neither is today:
      #
      #   1. The checks read the database with the service-role key, and this
      #      repository holds only VERCEL_TOKEN. Without the two secrets below
      #      the step has nothing to check.
      #   2. As of September 2026 the verified registry has 23 drifted entries
      #      out of 136, which is known debt tracked in the data-platform plan,
      #      not a regression this workflow should discover.
      #
      # This workflow is the only production deploy path, because vercel.json
      # disables the Git integration. A gate that fails here stops everything
      # from shipping, so it reports and moves on. To make it blocking: add the
      # secrets, get `npm run check:registry` green locally, then delete the
      # continue-on-error line.
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check verified registry (advisory)
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Skipped: SUPABASE_SERVICE_ROLE_KEY is not set for this repository."
            echo "Add it and NEXT_PUBLIC_SUPABASE_URL with: gh secret set <NAME>"
            exit 0
          fi
          npm ci
          npm run check:registry

      - name: Create deployment
        id: create
        run: |
          set -euo pipefail
          # -f alone fails with exit 22 and no body, which is what made a
          # revoked token look like an unexplained 8-second failure for weeks.
          # Capture the status and the body, then say which it was.
          HTTP=$(curl -s -o /tmp/deploy.json -w "%{http_code}" -X POST \
            "https://api.vercel.com/v13/deployments?teamId=${VERCEL_TEAM_ID}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"psx-portfolio-app\",
              \"project\": \"${VERCEL_PROJECT_ID}\",
              \"target\": \"production\",
              \"gitSource\": {
                \"type\": \"github\",
                \"repoId\": ${GITHUB_REPO_ID},
                \"ref\": \"${GITHUB_SHA}\"
              }
            }")
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "Vercel refused the deployment with HTTP $HTTP:"
            cat /tmp/deploy.json
            if [ "$HTTP" = "401" ] || [ "$HTTP" = "403" ]; then
              echo
              echo "That is an auth failure. Mint a new token at"
              echo "vercel.com/account/settings/tokens and run: gh secret set VERCEL_TOKEN"
            fi
            exit 1
          fi
          DEPLOYMENT_ID=$(python3 -c "import json; print(json.load(open('/tmp/deploy.json'))['id'])")
          DEPLOYMENT_URL=$(python3 -c "import json; print(json.load(open('/tmp/deploy.json'))['url'])")
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment $DEPLOYMENT_ID -> https://$DEPLOYMENT_URL"

      - name: Wait for build
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATE=$(curl -s \
              "https://api.vercel.com/v13/deployments/${{ steps.create.outputs.id }}?teamId=${VERCEL_TEAM_ID}" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('readyState','UNKNOWN'))")
            echo "[$i] $STATE"
            case "$STATE" in
              READY) exit 0 ;;
              ERROR|CANCELED|BLOCKED) echo "Deployment ended in $STATE"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for the deployment to finish."
          exit 1
